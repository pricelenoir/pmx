[project]
name = "pmx"
version = "0.1.0"
description = "Prediction-market trading system: venue connectors, order-book recorder, forecasters, strategies, paper/live execution"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "msgspec>=0.19",
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=42",
    "zstandard>=0.23",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "polars>=1.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]  # uv sync / uv run include it by default

[project.scripts]
pmx = "pmx.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import `tests.conftest`; plain `pytest` / `uv run pytest` need the repo root
markers = ["slow: performance budgets under load; run with `-m slow`"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pmx"]
