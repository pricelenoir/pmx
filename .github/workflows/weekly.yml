# Weekly, and on demand (Actions → Weekly → Run workflow): everything CI checks, against this week's toolchains;
# Kalshi's live public API through pmx's decoders (read-only, no key: a failure means Kalshi changed something pmx
# parses); and known vulnerabilities in the Python and Rust dependencies.
name: Weekly

on:
  schedule:
    - cron: "17 13 * * 1"  # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  kalshi-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - name: Kalshi's public API still decodes
        run: uv run --locked pytest -m network -q

  audit-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Known vulnerabilities in the locked dependencies
        run: |
          uv export --locked --no-hashes --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  audit-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Known vulnerabilities in the TUI's dependencies
        working-directory: tui
        run: cargo audit
