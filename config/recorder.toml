# The recorder (`pmx record`): the venue universe, any other sources, and how long raw logs are kept.

[recorder]
keep_days = 3650  # raw days older than this are deleted once compacted; compaction keeps only top of book, so raw
                 # is the only record of order-book depth (book-fidelity backtests, market-making research)

# Kalshi: every open market in each series, plus any explicit tickers. Re-discovered every refresh_s seconds.

[kalshi]
series = [
    "KXNFLGAME",  # NFL game winners
    "KXHIGHNY", "KXHIGHCHI", "KXHIGHAUS", "KXHIGHDEN", "KXHIGHPHIL",  # daily high temperature by city
    "KXBTCD", "KXETHD", "KXBTC15M",  # crypto: BTC/ETH above-below by the hour, BTC up-down every 15 minutes
    "KXCPI",      # CPI print
    "KXFED",      # Fed funds target
]
tickers = []
refresh_s = 300

# Any registered source plugin (`@source`) can be recorded: it runs as in `pmx run`, but only its raw
# records are kept. Domain data lives here, not in the recorder.
[[source]]
name = "espn"
kind = "espn_nfl"
params = { idle_s = 60, live_s = 5, summary_s = 15 }
